syntax = "proto3";

option csharp_namespace = "Groovra.Shared.Grpc";

package username;

service UserNameGrpcService {
  rpc GetUserNameGrpc (UserNameGrpcRequest) returns (GetUserNameGrpcResponse);
}

message UserNameGrpcRequest {
  string user_id = 1;
}

message GetUserNameGrpcResponse {
  // Системний логін (незмінний). Лишається полем 1 заради сумісності з наявними
  // споживачами (Chat, завантаження треків) - їхня поведінка не змінюється.
  string username = 1;
  // Публічне ім'я з профілю, яке юзер може міняти. Саме воно має показуватись як
  // автор альбому; якщо профілю немає - дорівнює username.
  string display_name = 2;
}
